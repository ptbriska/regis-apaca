<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran PATS - APACA Consulting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Selamat datang di portal pendaftaran Psikometric & Aptittude Test System APACA Consulting</h2>
            <p>Silakan lengkapi data diri dan pilih modul tes yang Anda butuhkan.</p>
        </div>

        <form id="registrationForm">
            <!-- Data Diri Utama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap <span style="color:red">*</span></label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap...">
            </div>

            <div class="form-group row">
                <div class="col">
                    <label for="email">Alamat Email (Aktif) <span style="color:red">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="contoh: nama@gmail.com">
                </div>
                <div class="col">
                    <label for="whatsapp">Nomor WhatsApp <span style="color:red">*</span></label>
                    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="Contoh: 081234567890">
                </div>
            </div>

            <div class="form-group row">
                <div class="col">
                    <label for="jenisKelamin">Jenis Kelamin <span style="color:red">*</span></label>
                    <select id="jenisKelamin" name="jenisKelamin" required class="form-control">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                <div class="col">
                    <label for="usia">Usia Pendaftar <span style="color:red">*</span></label>
                    <input type="number" id="usia" name="usia" required placeholder="Contoh: 18">
                </div>
            </div>

            <div class="form-group row">
                <div class="col">
                    <label for="instansi">Asal Instansi <span style="color:red">*</span></label>
                    <input type="text" id="instansi" name="instansi" required placeholder="Sekolah / Kampus / Kerja">
                </div>
                <div class="col">
                    <label for="lokasi">Asal Daerah (Terdeteksi Otomatis)</label>
                    <input type="text" id="lokasi" name="lokasi" readonly placeholder="Mendeteksi lokasi...">
                </div>
            </div>

            <div class="form-group">
                <label for="tujuanTes">Tujuan Mengikuti Tes</label>
                <select id="tujuanTes" name="tujuanTes" class="form-control">
                    <option value="Pengembangan Diri">Pengembangan Diri / Evaluasi Mandiri</option>
                    <option value="Persyaratan Sekolah/Kampus">Persyaratan Masuk Sekolah / Kampus</option>
                    <option value="Persiapan Karir/Rekrutmen">Persiapan Karir / Seleksi Kerja</option>
                    <option value="Rekomendasi Konseling">Pendampingan Konseling / Counseling</option>
                </select>
            </div>

            <!-- Pemilihan Modul -->
            <div class="form-group">
                <label>Pilih Single Module (Pilar 1, 2, & 3)</label>
                <div class="checkbox-group" id="singleModulesContainer">
                    <!-- Checkbox di-generate oleh JS -->
                </div>
            </div>

            <div class="form-group">
                <label>Pilih Bundling / Massal Institusi</label>
                <div class="checkbox-group" id="bundlingModulesContainer">
                    <!-- Checkbox di-generate oleh JS -->
                </div>
            </div>

            <!-- Total Harga -->
            <div class="total-box">
                <h3>Total yang harus dibayar:</h3>
                <h2 id="totalDisplay">Rp 0</h2>
                <input type="hidden" id="totalValue" name="total_bayar" value="0">
            </div>

            <!-- Upload Bukti Bayar (Kondisional: Diatur Dinamis via JS) -->
            <div class="form-group" id="buktiBayarGroup">
                <label for="buktiBayar" id="buktiBayarLabel">Upload Bukti Bayar <span style="color:red">*</span></label>
                <input type="file" id="buktiBayar" name="buktiBayar" accept="image/*,application/pdf">
            </div>

            <button type="submit" class="btn-submit">Daftar & Dapatkan Akses</button>
        </form>
    </div>

    <script src="config.js"></script>
</body>
</html>
